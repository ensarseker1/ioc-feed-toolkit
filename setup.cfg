[metadata]
name = ioc-feed-toolkit
version = 0.1.0
description = Offline IOC validation, normalization, deduplication, and provenance tracking
long_description = file: README.md
long_description_content_type = text/markdown
author = Ensar Seker
license = MIT
license_files = LICENSE
url = https://github.com/ensarseker1/ioc-feed-toolkit
project_urls =
    Issues = https://github.com/ensarseker1/ioc-feed-toolkit/issues
    Source = https://github.com/ensarseker1/ioc-feed-toolkit
classifiers =
    Development Status :: 3 - Alpha
    Environment :: Console
    Intended Audience :: Information Technology
    Intended Audience :: System Administrators
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Topic :: Security

[options]
packages = find:
package_dir =
    = src
python_requires = >=3.9
include_package_data = True

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    ioc-feed-toolkit = ioc_feed_toolkit.cli:main
