name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: python -m pip install --no-deps .
      - name: Compile source
        run: python -m compileall -q src
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Exercise installed CLI
        run: |
          ioc-feed-toolkit tests/fixtures/synthetic_feed.csv \
            tests/fixtures/synthetic_feed.json \
            --quiet --output ci-output.json
          python -c 'import json; data=json.load(open("ci-output.json", encoding="utf-8")); assert data["summary"]["unique_indicators"] == 5; assert data["summary"]["rejected"] == 2'
